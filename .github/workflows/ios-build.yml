name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build iOS Application Payload
        run: |
          xcodebuild -project ControlIncidenciasIOS.xcodeproj \
                     -scheme ControlIncidenciasIOS \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

          mkdir -p Payload
          cp -R build/Release-iphoneos/ControlIncidenciasIOS.app Payload/
          zip -r ControlIncidenciasIOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControlIncidencias-iOS-IPA
          path: ControlIncidenciasIOS.ipa
